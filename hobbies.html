<script>
  function resizeImageMap() {
    const img = document.querySelector(".hobbies-image");

    if (!img.complete || !img.naturalWidth) return;

    const map = document.querySelector(
      `map[name="${img.useMap.substring(1)}"]`,
    );

    if (!map) return;

    const scaleX = img.clientWidth / img.naturalWidth;
    const scaleY = img.clientHeight / img.naturalHeight;

    map.querySelectorAll("area").forEach((area) => {
      if (!area.dataset.originalCoords) {
        area.dataset.originalCoords = area.coords;
      }

      const originalCoords = area.dataset.originalCoords.split(",").map(Number);

      const scaledCoords = originalCoords.map((coord, index) => {
        return Math.round(coord * (index % 2 === 0 ? scaleX : scaleY));
      });

      area.coords = scaledCoords.join(",");
    });
  }

  const image = document.querySelector(".hobbies-image");

  image.addEventListener("load", resizeImageMap);
  window.addEventListener("resize", resizeImageMap);

  resizeImageMap();
</script>
